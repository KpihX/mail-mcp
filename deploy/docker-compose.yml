name: mail-mcp

services:
  mail-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mail-mcp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - mail_mcp_data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8094/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # --- Activation Traefik ---
      - "traefik.enable=true"

      # --- Routes Hybrides (Interne + Public) ---
      # Accès interne via Tailscale (.homelab) + Accès public via Cloudflare (.kpihx-labs.com)
      - "traefik.http.routers.mail-mcp.rule=Host(`mail.homelab`) || Host(`mail.kpihx-labs.com`)"
      - "traefik.http.routers.mail-mcp.entrypoints=websecure"
      - "traefik.http.routers.mail-mcp.tls=true"
      - "traefik.http.routers.mail-mcp.tls.certresolver=myresolver"

      # --- Sécurité (IP Allowlist + Cloudflare Access) ---
      # 1. Middleware Chain : IP Allowlist (Cloudflare IPs) + Headers
      - "traefik.http.routers.mail-mcp.middlewares=mail-mcp-security-chain"

      # 2. IP Allowlist (Seulement les IPs Cloudflare)
      - "traefik.http.middlewares.mail-mcp-ip-allowlist.ipwhitelist.sourcerange=10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,131.0.72.0/22"

      # 3. Headers de sécurité (existants)
      - "traefik.http.middlewares.mail-mcp-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.mail-mcp-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.mail-mcp-headers.headers.framedeny=true"

      # 4. Chain Middleware (Ordre important : IP Allowlist -> Headers)
      - "traefik.http.middlewares.mail-mcp-security-chain.chain.middlewares=mail-mcp-ip-allowlist,mail-mcp-headers"

      # --- Service ---
      - "traefik.http.services.mail-mcp.loadbalancer.server.port=8094"

networks:
  proxy:
    external: true

volumes:
  mail_mcp_data:
    name: deploy_mail_mcp_data
